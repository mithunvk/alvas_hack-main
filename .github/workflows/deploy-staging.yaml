name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: string

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Tests Before Deploy
        run: |
          cd backend
          python -m pytest --tb=short -q

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          # Add your actual staging deployment commands here
          # e.g., rsync, docker push, cloud deploy, etc.
          echo "✅ Staging deployment complete!"

      - name: Notify LaunchLoop
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
          # curl -X POST ${{ secrets.LAUNCHLOOP_WEBHOOK_URL }}/webhook/github \
          #   -H "Content-Type: application/json" \
          #   -d '{"event_type":"deployment","status":"${{ job.status }}","repo":"${{ github.repository }}","branch":"${{ github.ref_name }}"}'
