name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', publish, mithun]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd backend
          python -m pytest --tb=short -v

      - name: Notify LaunchLoop on Failure
        if: failure()
        run: |
          echo "CI failed — LaunchLoop webhook would be triggered here"
          # In production, send webhook to your backend:
          # curl -X POST ${{ secrets.LAUNCHLOOP_WEBHOOK_URL }}/webhook/github \
          #   -H "Content-Type: application/json" \
          #   -d '{"event_type":"workflow_run","status":"failure","repo":"${{ github.repository }}","branch":"${{ github.ref_name }}","commit_sha":"${{ github.sha }}","error_summary":"CI pipeline failed"}'

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
