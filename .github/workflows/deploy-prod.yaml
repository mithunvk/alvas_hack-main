name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: string
      approved_by:
        description: 'Approver name/email'
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      # GitHub environment protection rules enforce manual approval

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Approval
        run: |
          echo "🔐 Production deployment approved by: ${{ inputs.approved_by }}"
          echo "Environment: ${{ inputs.environment }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Full Test Suite
        run: |
          cd backend
          python -m pytest --tb=long -v

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to PRODUCTION environment..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Approved by: ${{ inputs.approved_by }}"
          # Add your actual production deployment commands here
          echo "✅ Production deployment complete!"

      - name: Notify LaunchLoop
        if: always()
        run: |
          echo "Production deployment status: ${{ job.status }}"
          # curl -X POST ${{ secrets.LAUNCHLOOP_WEBHOOK_URL }}/webhook/github \
          #   -H "Content-Type: application/json" \
          #   -d '{"event_type":"deployment","status":"${{ job.status }}","repo":"${{ github.repository }}","branch":"${{ github.ref_name }}"}'
